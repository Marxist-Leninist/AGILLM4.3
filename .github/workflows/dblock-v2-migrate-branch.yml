name: Migrate DBlock composition source v2

on:
  push:
    branches: [codex/dblock-composition-v2-20260826]
    paths: ['.github/workflows/dblock-v2-migrate-branch.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dblock-composition-v2-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Migrate source and verify
        run: |
          python tools/patch_dblock_stratified_objectives.py agillm41.py --in-place
          python -m py_compile agillm41.py tools/patch_dblock_stratified_objectives.py tests/test_dblock_stratified_objectives.py
          python -m unittest tests.test_dblock_stratified_objectives -v
          git diff --check
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- agillm41.py; then exit 0; fi
          git add agillm41.py
          git commit -m 'fix: reset objective strata on DBlock repartition'
          git push origin HEAD:codex/dblock-composition-v2-20260826
